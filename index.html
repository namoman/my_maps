<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>월미바다열차 교각 GPS 등록페이지</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 30px; font-size: 16px; margin: 10px; cursor: pointer; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        #map { width: 100%; height: 400px; margin-top: 20px; border-radius: 8px; text-align: left; }
        #presetSelect { padding: 10px; width: 80%; font-size: 16px; margin-bottom: 8px; }
        #gateInput { padding: 10px; width: 80%; font-size: 16px; margin-bottom: 8px; }
        #adjustPanel {
            display: none;
            max-width: 420px;
            margin: 12px auto;
            padding: 12px;
            border: 2px solid #FF9800;
            border-radius: 8px;
            background: #FFF8E1;
            text-align: center;
        }
        #adjustPanel .nudge-grid {
            display: grid;
            grid-template-columns: 64px 64px 64px;
            grid-template-rows: 48px 48px 48px;
            gap: 6px;
            justify-content: center;
            margin: 10px 0;
        }
        #adjustPanel .nudge-grid button {
            padding: 0;
            margin: 0;
            font-size: 20px;
            min-width: 64px;
        }
        #adjustCoords { font-size: 13px; color: #555; word-break: break-all; }
    </style>
</head>
<body>

    <!-- 비밀번호 게이트 -->
    <div id="gate" style="max-width:400px; margin:80px auto; text-align:center;">
        <h2>🔒 월미바다열차 교각 GPS 등록페이지</h2>
        <p>작업에 필요한 비밀번호입니다.</p>
        <input type="password" id="gateInput" placeholder="비밀번호 입력" style="padding:12px; width:70%; font-size:16px;"><br>
        <button onclick="checkPassword()" style="margin-top:12px;">확인</button>
        <p id="gateError" style="color:red; display:none;">비밀번호가 틀렸습니다.</p>
        <p id="gateLoading" style="color:#666; margin-top:8px;">설정 파일을 불러오는 중...</p>
    </div>

    <!-- 본문 (비밀번호 확인 후 표시) -->
    <div id="main" style="display:none;">

        <h2>📍 월미바다열차 교각 GPS 등록페이지</h2>
    <select id="presetSelect"></select><br>
    <input type="text" id="pinName" placeholder="또는 직접 입력 (입력하면 프리셋보다 우선)"><br>
    <button id="btnStartPin" onclick="addCurrentLocation()">현재 위치 핀 찍기</button>
    <button onclick="goToMyLocation()" style="background-color: #2196F3; color: white;">내 위치로 이동 (실시간)</button>
    <button onclick="downloadCSV()" style="background-color: #4CAF50; color: white;">CSV 다운로드</button>

    <div id="adjustPanel">
        <strong id="adjustTitle">위치 미세 조정</strong>
        <p style="margin:8px 0; font-size:14px;">마커를 드래그하거나, 지도를 탭하거나, 아래 버튼으로 조금씩 옮긴 뒤 저장하세요.</p>
        <div id="adjustCoords"></div>
        <div class="nudge-grid">
            <span></span>
            <button type="button" onclick="nudgeDraft(0, 1)" aria-label="북으로">▲</button>
            <span></span>
            <button type="button" onclick="nudgeDraft(-1, 0)" aria-label="서로">◀</button>
            <button type="button" onclick="nudgeDraft(0, 0)" title="GPS로 되돌리기" style="font-size:12px;">GPS</button>
            <button type="button" onclick="nudgeDraft(1, 0)" aria-label="동으로">▶</button>
            <span></span>
            <button type="button" onclick="nudgeDraft(0, -1)" aria-label="남으로">▼</button>
            <span></span>
        </div>
        <label style="font-size:14px;">이동 간격
            <select id="nudgeStep">
                <option value="0.00001">약 1m</option>
                <option value="0.00002" selected>약 2m</option>
                <option value="0.00005">약 5m</option>
                <option value="0.0001">약 10m</option>
            </select>
        </label>
        <div style="margin-top:12px;">
            <button type="button" onclick="confirmDraftPin()" style="background-color:#FF9800; color:white;">이 위치로 저장</button>
            <button type="button" onclick="cancelDraftPin()">취소</button>
        </div>
    </div>

    <div id="map"></div>

    <table id="logTable">
        <thead>
            <tr>
                <th>이름</th>
                <th>위도(Latitude)</th>
                <th>경도(Longitude)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script>
        // 배포할 때마다 version.json 과 같이 올릴 것
        const APP_VERSION = '20261104-6';
        let versionReloadScheduled = false;

        async function checkAppVersion() {
            if (versionReloadScheduled) return;
            try {
                const resp = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
                if (!resp.ok) return;
                const data = await resp.json();
                if (data.v && data.v !== APP_VERSION) {
                    versionReloadScheduled = true;
                    const url = new URL(location.href);
                    url.searchParams.set('_v', data.v);
                    location.replace(url.toString());
                }
            } catch (err) {
                console.warn('version check failed', err);
            }
        }

        setInterval(checkAppVersion, 10000);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') checkAppVersion();
        });
        setTimeout(checkAppVersion, 2000);

        let pinList = [];
        let map = null;
        let myLocationMarker = null;
        let watchId = null;
        let lastLiveWriteAt = 0;
        const LIVE_WRITE_MS = 2000;
        const otherLiveMarkers = new Map();
        const seenPinIds = new Set();
        let unsubscribePins = null;
        let unsubscribeLive = null;
        let draftMarker = null;
        let draftName = '';
        let draftGpsLat = null;
        let draftGpsLng = null;
        let mapClickBound = false;

        // ===== Firebase (Firestore) =====
        firebase.initializeApp({
            apiKey: "AIzaSyDPD86Li9H4LkwF4To2OMasvE3uJ_21hPA",
            authDomain: "mymaps-4858d.firebaseapp.com",
            projectId: "mymaps-4858d",
            storageBucket: "mymaps-4858d.firebasestorage.app",
            messagingSenderId: "994084650008",
            appId: "1:994084650008:web:7ad7acc00757490666976d",
            measurementId: "G-27S3SBF50L"
        });
        const db = firebase.firestore();

        // ===== 비밀번호 게이트 - config.json(base64) 에서 비동기로 로드 =====
        // 모바일은 탭 복원 시 sessionStorage가 비는 경우가 많아 localStorage 사용
        const AUTH_KEY = 'wolmi_auth';
        const AUTH_PW_KEY = 'wolmi_auth_pw';
        let PAGE_PASSWORD = null;

        function passwordToken(password) {
            return btoa(unescape(encodeURIComponent(String(password || ''))));
        }

        function persistAuth() {
            localStorage.setItem(AUTH_KEY, '1');
            localStorage.setItem(AUTH_PW_KEY, passwordToken(PAGE_PASSWORD));
            try { sessionStorage.removeItem(AUTH_KEY); } catch (_) { /* ignore */ }
        }

        function clearAuth() {
            localStorage.removeItem(AUTH_KEY);
            localStorage.removeItem(AUTH_PW_KEY);
            try { sessionStorage.removeItem(AUTH_KEY); } catch (_) { /* ignore */ }
        }

        function hasValidStoredAuth() {
            // 구버전 sessionStorage → localStorage 이관
            if (sessionStorage.getItem(AUTH_KEY) === '1' && localStorage.getItem(AUTH_KEY) !== '1') {
                localStorage.setItem(AUTH_KEY, '1');
            }
            if (localStorage.getItem(AUTH_KEY) !== '1') return false;
            const saved = localStorage.getItem(AUTH_PW_KEY);
            // 예전 세션(비번 토큰 없음): 현재 비번으로 보강 후 유지
            if (!saved) {
                localStorage.setItem(AUTH_PW_KEY, passwordToken(PAGE_PASSWORD));
                return true;
            }
            if (saved !== passwordToken(PAGE_PASSWORD)) {
                clearAuth();
                return false;
            }
            return true;
        }

        async function loadConfig() {
            const loading = document.getElementById('gateLoading');
            let lastError = null;
            for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                    const resp = await fetch('config.json?t=' + Date.now(), { cache: 'no-store' });
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const cfg = await resp.json();
                    PAGE_PASSWORD = atob(cfg.password);
                    loading.style.display = 'none';
                    return true;
                } catch (err) {
                    lastError = err;
                    await new Promise((r) => setTimeout(r, 400 * attempt));
                }
            }
            console.error('config load failed', lastError);
            loading.textContent = '설정 파일 로드에 실패했습니다. 잠시 후 다시 시도하세요.';
            loading.style.color = 'red';
            return false;
        }

        function checkPassword() {
            const input = document.getElementById('gateInput');
            const tryUnlock = () => {
                if (input.value === PAGE_PASSWORD) {
                    persistAuth();
                    unlock();
                } else {
                    document.getElementById('gateError').style.display = 'block';
                    input.value = '';
                    input.focus();
                }
            };
            if (!PAGE_PASSWORD) {
                loadConfig().then((ok) => {
                    if (!ok) return;
                    tryUnlock();
                });
                return;
            }
            tryUnlock();
        }

        function unlock() {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('main').style.display = 'block';
            buildPresets();
            initMap();
            subscribePins();
            subscribeLiveLocations();
            startLiveTracking(false);
        }

        // ===== 지도 초기화 (게이트 통과 후 실행) =====
        function initMap() {
            if (map) return;
            map = L.map('map').setView([37.4690, 126.6130], 16);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        }

        function fitAllPins() {
            if (!map || pinList.length === 0) return;
            const bounds = L.latLngBounds(pinList.map(p => [p.lat, p.lng]));
            map.fitBounds(bounds, { padding: [30, 30], maxZoom: 17 });
        }

        function addPinToUI(name, lat, lng, openPopup) {
            pinList.push({ name, lat, lng });

            const marker = L.marker([lat, lng])
                .addTo(map)
                .bindPopup(`<b>${name}</b><br>${lat.toFixed(6)}, ${lng.toFixed(6)}`);
            if (openPopup) marker.openPopup();

            const tbody = document.getElementById('logTable').querySelector('tbody');
            tbody.innerHTML += `<tr><td>${name}</td><td>${lat}</td><td>${lng}</td></tr>`;
        }

        function subscribePins() {
            if (unsubscribePins) return;
            unsubscribePins = db.collection('pins')
                .orderBy('createdAt', 'asc')
                .onSnapshot((snap) => {
                    let added = false;
                    snap.docChanges().forEach((change) => {
                        if (change.type !== 'added') return;
                        const id = change.doc.id;
                        if (seenPinIds.has(id)) return;
                        seenPinIds.add(id);
                        const d = change.doc.data();
                        if (typeof d.lat !== 'number' || typeof d.lng !== 'number') return;
                        addPinToUI(String(d.name || '포인트'), d.lat, d.lng, false);
                        added = true;
                    });
                    if (added) fitAllPins();
                }, (err) => {
                    console.error('Firestore subscribe failed', err);
                    alert('실시간 핀 동기화에 실패했습니다: ' + err.message);
                });
        }

        async function savePinToFirestore(name, lat, lng) {
            const ref = await db.collection('pins').add({
                name,
                lat,
                lng,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            return ref.id;
        }

        // ===== 핀 이름 프리셋 (게이트 통과 후 빌드) =====
        const STATIONS = ['101역', '102역', '103역', '104역'];
        const FR_PIERS = new Set([
            37, 40, 43, 46, 49, 52, 56, 59, 62, 65, 68,
            80, 84, 88, 91, 94,
            103, 106, 109, 112, 115, 118, 121, 124, 127,
            130, 133, 137, 140, 143, 146, 149
        ]);
        const PIER_MAX = 152;

        let nameInput, presetSelect;

        function buildPresets() {
            if (presetSelect) return; // 이미 빌드됨
            presetSelect = document.getElementById('presetSelect');
            nameInput = document.getElementById('pinName');

            const stGroup = document.createElement('optgroup');
            stGroup.label = '역';
            STATIONS.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s; opt.textContent = s;
                stGroup.appendChild(opt);
            });
            presetSelect.appendChild(stGroup);

            const pierGroup = document.createElement('optgroup');
            pierGroup.label = '교각';
            for (let n = 1; n <= PIER_MAX; n++) {
                if (FR_PIERS.has(n)) {
                    ['F', 'R'].forEach(suffix => {
                        const opt = document.createElement('option');
                        opt.value = `P${n}${suffix}`; opt.textContent = `P${n}${suffix}`;
                        pierGroup.appendChild(opt);
                    });
                } else {
                    const opt = document.createElement('option');
                    opt.value = `P${n}`; opt.textContent = `P${n}`;
                    pierGroup.appendChild(opt);
                }
            }
            presetSelect.appendChild(pierGroup);
        }

        document.getElementById('gateInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        // 새로고침/탭 복원 시 localStorage 세션 복원
        loadConfig().then((ok) => {
            if (!ok) return;
            if (hasValidStoredAuth()) {
                unlock();
                return;
            }
            document.getElementById('gateInput').focus();
        });

        function getClientId() {
            let id = localStorage.getItem('wolmi_client_id');
            if (!id) {
                id = (crypto.randomUUID && crypto.randomUUID())
                    || ('c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10));
                localStorage.setItem('wolmi_client_id', id);
            }
            return id;
        }

        function upsertMyMarker(lat, lng, centerMap) {
            if (!map) return;
            if (myLocationMarker) {
                myLocationMarker.setLatLng([lat, lng]);
            } else {
                myLocationMarker = L.circleMarker([lat, lng], {
                    radius: 8,
                    color: '#1565C0',
                    fillColor: '#2196F3',
                    fillOpacity: 0.9,
                    weight: 2
                }).addTo(map);
            }
            myLocationMarker.bindPopup(
                `내 위치 (실시간)<br>${lat.toFixed(6)}, ${lng.toFixed(6)}`
            );
            if (centerMap) {
                map.setView([lat, lng], Math.max(map.getZoom(), 18));
                myLocationMarker.openPopup();
            }
        }

        function publishLiveLocation(lat, lng) {
            const now = Date.now();
            if (now - lastLiveWriteAt < LIVE_WRITE_MS) return;
            lastLiveWriteAt = now;
            db.collection('liveLocations').doc(getClientId()).set({
                lat,
                lng,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).catch((err) => {
                console.error('live location write failed', err);
            });
        }

        function upsertOtherLiveMarker(clientId, lat, lng) {
            if (!map) return;
            let marker = otherLiveMarkers.get(clientId);
            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.circleMarker([lat, lng], {
                    radius: 7,
                    color: '#E65100',
                    fillColor: '#FF9800',
                    fillOpacity: 0.9,
                    weight: 2
                }).addTo(map);
                otherLiveMarkers.set(clientId, marker);
            }
            marker.bindPopup(
                `다른 작업자<br>${lat.toFixed(6)}, ${lng.toFixed(6)}`
            );
        }

        function subscribeLiveLocations() {
            if (unsubscribeLive) return;
            const myId = getClientId();
            unsubscribeLive = db.collection('liveLocations').onSnapshot((snap) => {
                snap.docChanges().forEach((change) => {
                    const id = change.doc.id;
                    if (id === myId) return;
                    if (change.type === 'removed') {
                        const marker = otherLiveMarkers.get(id);
                        if (marker) {
                            map.removeLayer(marker);
                            otherLiveMarkers.delete(id);
                        }
                        return;
                    }
                    const d = change.doc.data();
                    if (typeof d.lat !== 'number' || typeof d.lng !== 'number') return;
                    upsertOtherLiveMarker(id, d.lat, d.lng);
                });
            }, (err) => {
                console.error('live location subscribe failed', err);
            });
        }

        function startLiveTracking(centerOnce) {
            if (!map) return;
            if (!navigator.geolocation) {
                alert('이 브라우저는 GPS를 지원하지 않습니다.');
                return;
            }

            if (watchId !== null) {
                if (centerOnce && myLocationMarker) {
                    const ll = myLocationMarker.getLatLng();
                    map.setView(ll, Math.max(map.getZoom(), 18));
                    myLocationMarker.openPopup();
                }
                return;
            }

            let shouldCenter = centerOnce;
            watchId = navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                upsertMyMarker(lat, lng, shouldCenter);
                shouldCenter = false;
                publishLiveLocation(lat, lng);
            }, (err) => {
                console.error('GPS watch failed', err);
                alert('GPS 위치를 가져오는데 실패했습니다: ' + err.message);
            }, {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 15000
            });
        }

        function goToMyLocation() {
            if (!map) {
                alert('지도가 아직 준비되지 않았습니다.');
                return;
            }
            startLiveTracking(true);
        }

        function updateAdjustCoords() {
            if (!draftMarker) return;
            const ll = draftMarker.getLatLng();
            document.getElementById('adjustCoords').textContent =
                `조정 위치: ${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}` +
                (draftGpsLat != null
                    ? `  (GPS: ${draftGpsLat.toFixed(6)}, ${draftGpsLng.toFixed(6)})`
                    : '');
            draftMarker.setPopupContent(
                `<b>${draftName}</b><br>드래그/탭으로 조정<br>${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}`
            );
        }

        function setAdjustMode(active) {
            document.getElementById('adjustPanel').style.display = active ? 'block' : 'none';
            document.getElementById('btnStartPin').disabled = active;
            if (active && !mapClickBound && map) {
                mapClickBound = true;
                map.on('click', onMapClickWhileAdjusting);
            }
        }

        function onMapClickWhileAdjusting(e) {
            if (!draftMarker) return;
            draftMarker.setLatLng(e.latlng);
            updateAdjustCoords();
        }

        function clearDraftMarker() {
            if (draftMarker && map) {
                map.removeLayer(draftMarker);
            }
            draftMarker = null;
            draftName = '';
            draftGpsLat = null;
            draftGpsLng = null;
            setAdjustMode(false);
        }

        function startAdjustMode(name, lat, lng) {
            clearDraftMarker();
            draftName = name;
            draftGpsLat = lat;
            draftGpsLng = lng;
            document.getElementById('adjustTitle').textContent = `[${name}] 위치 미세 조정`;

            draftMarker = L.marker([lat, lng], {
                draggable: true,
                autoPan: true
            }).addTo(map);
            draftMarker.bindPopup(
                `<b>${name}</b><br>드래그/탭으로 조정<br>${lat.toFixed(6)}, ${lng.toFixed(6)}`
            ).openPopup();
            draftMarker.on('dragend', updateAdjustCoords);

            map.setView([lat, lng], Math.max(map.getZoom(), 18));
            updateAdjustCoords();
            setAdjustMode(true);
        }

        function nudgeDraft(dirLng, dirLat) {
            if (!draftMarker) return;
            // 가운데 GPS 버튼: 원래 GPS로 복귀
            if (dirLng === 0 && dirLat === 0) {
                if (draftGpsLat == null) return;
                draftMarker.setLatLng([draftGpsLat, draftGpsLng]);
                updateAdjustCoords();
                return;
            }
            const step = Number(document.getElementById('nudgeStep').value) || 0.00002;
            const ll = draftMarker.getLatLng();
            draftMarker.setLatLng([ll.lat + dirLat * step, ll.lng + dirLng * step]);
            updateAdjustCoords();
        }

        function cancelDraftPin() {
            clearDraftMarker();
        }

        async function confirmDraftPin() {
            if (!draftMarker) return;
            const ll = draftMarker.getLatLng();
            const name = draftName;
            const lat = ll.lat;
            const lng = ll.lng;

            try {
                const id = await savePinToFirestore(name, lat, lng);
                seenPinIds.add(id);
                clearDraftMarker();
                addPinToUI(name, lat, lng, true);
                fitAllPins();
                nameInput.value = '';
                alert(`[${name}] 핀이 저장되었습니다.`);
            } catch (err) {
                console.error('Firestore save failed', err);
                alert('서버 저장에 실패했습니다: ' + err.message);
            }
        }

        function addCurrentLocation() {
            if (draftMarker) {
                alert('이미 위치 조정 중입니다. 저장하거나 취소하세요.');
                return;
            }

            const name = nameInput.value.trim() || presetSelect.value || `포인트_${pinList.length + 1}`;

            if (!navigator.geolocation) {
                alert("이 브라우저는 GPS를 지원하지 않습니다.");
                return;
            }

            navigator.geolocation.getCurrentPosition((position) => {
                startAdjustMode(
                    name,
                    position.coords.latitude,
                    position.coords.longitude
                );
            }, (err) => {
                alert("GPS 위치를 가져오는데 실패했습니다: " + err.message);
            }, { enableHighAccuracy: true });
        }

        function downloadCSV() {
            if (pinList.length === 0) {
                alert("다운로드할 데이터가 없습니다.");
                return;
            }

            // 구글 맵 인식용 헤더 설정 (BOM 추가로 한글 깨짐 방지)
            let csvContent = "\uFEFFName,Latitude,Longitude\n";

            pinList.forEach(pin => {
                csvContent += `"${pin.name}",${pin.lat},${pin.lng}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "my_gis_pins.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
