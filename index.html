<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간이 GIS 핀 수집기</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 30px; font-size: 16px; margin: 10px; cursor: pointer; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        #map { width: 100%; height: 400px; margin-top: 20px; border-radius: 8px; text-align: left; }
        #presetSelect { padding: 10px; width: 80%; font-size: 16px; margin-bottom: 8px; }
        #pinName { padding: 10px; width: 80%; font-size: 16px; }
    </style>
</head>
<body>

    <h2>📍 내 위치 GIS 핀 수집기</h2>
    <select id="presetSelect"></select><br>
    <input type="text" id="pinName" placeholder="또는 직접 입력 (입력하면 프리셋보다 우선)"><br>
    <button onclick="addCurrentLocation()">현재 위치 핀 찍기</button>
    <button onclick="downloadCSV()" style="background-color: #4CAF50; color: white;">CSV 다운로드</button>

    <div id="map"></div>

    <table id="logTable">
        <thead>
            <tr>
                <th>이름</th>
                <th>위도(Latitude)</th>
                <th>경도(Longitude)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let pinList = [];

        // ===== 핀 이름 프리셋 =====
        // 월미바다열차 정기안전점검 자료 기준 (교각.상부 정리.pdf)
        // F/R이 있는 교각 번호 (총 31개): 상부거더·하부교각 표에서 -F/-R로 표기된 교각
        const STATIONS = ['101역', '102역', '103역', '104역'];
        const FR_PIERS = new Set([
            37, 40, 43, 46, 49, 52, 56, 59, 62, 65, 68,
            80, 84, 88, 91, 94,
            103, 106, 109, 112, 115, 118, 121, 124,
            130, 133, 137, 140, 143, 146, 149
        ]);
        const PIER_MAX = 152;

        const presetSelect = document.getElementById('presetSelect');
        const nameInput = document.getElementById('pinName');

        function buildPresets() {
            const stGroup = document.createElement('optgroup');
            stGroup.label = '역';
            STATIONS.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s; opt.textContent = s;
                stGroup.appendChild(opt);
            });
            presetSelect.appendChild(stGroup);

            const pierGroup = document.createElement('optgroup');
            pierGroup.label = '교각';
            for (let n = 1; n <= PIER_MAX; n++) {
                if (FR_PIERS.has(n)) {
                    ['F', 'R'].forEach(suffix => {
                        const opt = document.createElement('option');
                        opt.value = `P${n}${suffix}`; opt.textContent = `P${n}${suffix}`;
                        pierGroup.appendChild(opt);
                    });
                } else {
                    const opt = document.createElement('option');
                    opt.value = `P${n}`; opt.textContent = `P${n}`;
                    pierGroup.appendChild(opt);
                }
            }
            presetSelect.appendChild(pierGroup);
        }
        buildPresets();

        // ===== 지도 초기화 (기본: 대한민국 전경) =====
        const map = L.map('map').setView([36.5, 127.9], 7);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        function addCurrentLocation() {
            // 직접 입력이 있으면 우선, 없으면 프리셋 사용
            const name = nameInput.value.trim() || presetSelect.value || `포인트_${pinList.length + 1}`;

            if (!navigator.geolocation) {
                alert("이 브라우저는 GPS를 지원하지 않습니다.");
                return;
            }

            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                // 리스트에 추가
                pinList.push({ name, lat, lng });

                // 지도에 마커 추가
                L.marker([lat, lng])
                    .addTo(map)
                    .bindPopup(`<b>${name}</b><br>${lat.toFixed(6)}, ${lng.toFixed(6)}`)
                    .openPopup();

                // 모든 핀이 한 화면에 보이도록 범위 조정
                const bounds = L.latLngBounds(pinList.map(p => [p.lat, p.lng]));
                map.fitBounds(bounds, { padding: [30, 30], maxZoom: 17 });

                // 테이블에 표시
                const tbody = document.getElementById('logTable').querySelector('tbody');
                const row = `<tr><td>${name}</td><td>${lat}</td><td>${lng}</td></tr>`;
                tbody.innerHTML += row;

                // 초기화
                nameInput.value = '';
                alert(`[${name}] 핀이 성공적으로 찍혔습니다.`);
            }, (err) => {
                alert("GPS 위치를 가져오는데 실패했습니다: " + err.message);
            }, { enableHighAccuracy: true });
        }

        function downloadCSV() {
            if (pinList.length === 0) {
                alert("다운로드할 데이터가 없습니다.");
                return;
            }

            // 구글 맵 인식용 헤더 설정 (BOM 추가로 한글 깨짐 방지)
            let csvContent = "\uFEFFName,Latitude,Longitude\n";

            pinList.forEach(pin => {
                csvContent += `"${pin.name}",${pin.lat},${pin.lng}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "my_gis_pins.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
